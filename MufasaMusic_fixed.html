<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUFASA — Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Load fonts async so they never block render -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --g:#D4942A;--gl:#F0B84A;--gd:#A8741F;
  --gdim:rgba(212,148,42,.2);--gfaint:rgba(212,148,42,.06);
  --bg:#050403;--s1:#0C0A08;--s2:#121008;
  --card:#18150F;--card2:#1F1B12;
  --b1:rgba(212,148,42,.13);--b2:rgba(212,148,42,.32);
  --w:#F4EFE4;--grey:#A09890;--dim:#7A7570;
  --r:6px;--r2:12px;--r3:20px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow-x:hidden;}
body{font-family:'Barlow',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--w);}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--card2);border:1px solid var(--b2);border-radius:var(--r2);padding:9px 18px;font-family:'Barlow Condensed',sans-serif;font-size:.82rem;letter-spacing:.06em;color:var(--w);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:999;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.wrap{min-height:100vh;padding:20px 18px 80px;max-width:700px;margin:0 auto;}
.m-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--b1);}
.m-logo{font-family:'Anton',impact,sans-serif;font-size:1.1rem;letter-spacing:.1em;color:var(--g);}
.m-title{font-family:'Barlow Condensed',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);}
.m-live{display:flex;align-items:center;gap:5px;font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--g);}
.m-live::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--g);animation:blink 2s ease infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.mwrap{background:var(--card);border:1px solid var(--b1);border-radius:var(--r3);padding:22px;margin-bottom:18px;}
.mnow{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
.mdisc{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--gd),var(--s2));border:3px solid var(--b2);display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;}
.mdisc.sp{animation:sp 4s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
#mCover{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--b2);display:none;flex-shrink:0;}
#mCover.sp{animation:sp 4s linear infinite;}
.minfo{flex:1;min-width:0;}
.mtrack{font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.martist{font-size:.8rem;color:var(--grey);margin-top:2px;}
.mctrls{display:flex;align-items:center;gap:9px;margin-top:10px;}
.mc{background:none;border:none;color:var(--grey);font-size:1.1rem;cursor:pointer;padding:4px;transition:color .2s;}
.mc:hover{color:var(--g);}
.mc-play{width:42px;height:42px;background:linear-gradient(135deg,var(--gd),var(--gl));border:none;border-radius:50%;color:var(--bg);font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s;box-shadow:0 4px 14px rgba(212,148,42,.3);}
.mc-play:hover{transform:scale(1.08);}
#muf-embed-area{margin-bottom:10px;display:none;}
#muf-embed-area iframe,#muf-embed-area video{width:100%;border-radius:var(--r2);border:none;display:block;}
.mprog{width:100%;height:3px;background:var(--b1);border-radius:2px;overflow:hidden;margin-top:12px;cursor:pointer;}
.mprogf{height:100%;background:linear-gradient(90deg,var(--gd),var(--gl));border-radius:2px;width:0;transition:width .5s linear;}
.m-time{display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-size:.68rem;color:var(--dim);margin-top:5px;}
.worm-wrap{display:flex;gap:3px;margin-top:10px;align-items:center;}
.wseg{height:4px;background:var(--b1);border-radius:2px;flex:1;transition:background .3s;}
.wseg.done{background:var(--gd);}
.wseg.act{background:var(--gl);animation:wp .8s ease infinite alternate;}
@keyframes wp{from{opacity:.6;}to{opacity:1;}}
.local-bar{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px dashed var(--b2);border-radius:var(--r2);padding:11px 14px;margin-bottom:16px;cursor:pointer;transition:border-color .2s,background .2s;}
.local-bar:hover{border-color:var(--g);background:var(--gfaint);}
.local-bar-ic{font-size:1.1rem;flex-shrink:0;}
.local-bar-txt{flex:1;min-width:0;}
.local-bar-lbl{font-family:'Barlow Condensed',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gl);}
.local-bar-sub{font-size:.71rem;color:var(--dim);margin-top:1px;}
.local-badge{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--gdim);border:1px solid var(--b2);border-radius:4px;color:var(--g);padding:2px 7px;flex-shrink:0;}
#muf-local-upload{display:none;}
.mtabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;}
.mtab{background:none;border:1px solid var(--b1);color:var(--grey);padding:5px 13px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:.74rem;font-weight:600;cursor:pointer;transition:all .2s;}
.mtab.on,.mtab:hover{border-color:var(--g);color:var(--g);background:var(--gfaint);}
.mlist{display:flex;flex-direction:column;gap:1px;}
.mitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r);cursor:pointer;transition:background .2s;}
.mitem:hover,.mitem.act{background:var(--gfaint);}
.mitem.act{border-left:2px solid var(--g);padding-left:9px;}
.mnum{font-family:'Barlow Condensed',sans-serif;font-size:.78rem;color:var(--dim);width:22px;text-align:center;flex-shrink:0;}
.mitem-thumb{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1.5px solid var(--b1);flex-shrink:0;}
.mitem-i{flex:1;min-width:0;}
.mitem-t{font-size:.86rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mitem-a{font-size:.73rem;color:var(--grey);}
.mitem-d{font-size:.73rem;color:var(--dim);flex-shrink:0;}
.mshr{background:none;border:none;color:var(--dim);cursor:pointer;padding:3px;font-size:.82rem;transition:color .2s;flex-shrink:0;}
.mshr:hover{color:var(--g);}
.empty{padding:36px 20px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:.85rem;color:var(--grey);line-height:1.7;}
.empty strong{color:var(--g);display:block;font-size:1.05rem;margin-bottom:4px;}
</style>
</head>
<body>
<div id="toast"></div>
<input type="file" id="muf-local-upload" accept="audio/*,.mp3,.wav,.aac,.m4a,.flac,.ogg,.opus,.wma,.aiff" multiple>

<div class="wrap">
  <div class="m-header">
    <div>
      <div class="m-logo">MUFASA</div>
      <div class="m-title">Workout Music</div>
    </div>
    <div class="m-live">WORM PLAYLIST</div>
  </div>

  <div class="mwrap">
    <div id="muf-embed-area"></div>
    <div class="mnow">
      <div id="mMediaArea" style="flex-shrink:0;position:relative;">
        <img id="mCover" alt="cover">
        <div class="mdisc" id="muf-disc">🎵</div>
      </div>
      <div class="minfo">
        <div class="mtrack" id="muf-track-title">Select a track below</div>
        <div class="martist" id="muf-track-artist">—</div>
        <div class="mctrls">
          <button class="mc" onclick="MusicEngine.prev()">⏮</button>
          <button class="mc-play" id="muf-btn-play" onclick="MusicEngine.togglePlay()">▶</button>
          <button class="mc" onclick="MusicEngine.next()">⏭</button>
          <button class="mc" id="muf-btn-shuffle" onclick="MusicEngine.toggleShuffle()" title="Shuffle">🔀</button>
          <button class="mc" id="muf-btn-repeat" onclick="MusicEngine.toggleRepeat()" title="Repeat">🔁</button>
        </div>
      </div>
    </div>
    <div class="mprog" id="muf-progress"><div class="mprogf" id="muf-progress-fill"></div></div>
    <div class="m-time"><span id="muf-time">0:00 / 0:00</span></div>
    <div class="worm-wrap" id="worm"></div>
  </div>

  <!-- Local file upload bar -->
  <div class="local-bar" onclick="document.getElementById('muf-local-upload').click()">
    <div class="local-bar-ic">📁</div>
    <div class="local-bar-txt">
      <div class="local-bar-lbl">Load Local Files</div>
      <div class="local-bar-sub">MP3, WAV, AAC, FLAC — saved across sessions</div>
    </div>
    <div class="local-badge" id="localBadge" style="display:none">0 loaded</div>
  </div>

  <!-- Local tracks list -->
  <div id="muf-local-tracks" style="margin-bottom:12px;"></div>

  <!-- Category tabs -->
  <div class="mtabs" id="mTabs">
    <button class="mtab on" onclick="filterM('all',this)">ALL</button>
    <button class="mtab" onclick="filterM('hype',this)">HYPE</button>
    <button class="mtab" onclick="filterM('afro',this)">AFROBEATS</button>
    <button class="mtab" onclick="filterM('hip',this)">HIP HOP</button>
    <button class="mtab" onclick="filterM('elec',this)">ELECTRONIC</button>
    <button class="mtab" onclick="filterM('local',this)">📁 MY FILES</button>
  </div>

  <div class="mlist" id="muf-track-list"></div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
'use strict';

// ══════════════════════════════════════════════════════════════
//  IndexedDB Setup
// ══════════════════════════════════════════════════════════════
const DB_NAME    = 'MufasaMusicDB';
const DB_VERSION = 3;
let   idb        = null;

function openIDB() {
  return new Promise((resolve, reject) => {
    if (idb) { resolve(idb); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('state'))
        db.createObjectStore('state');
      if (!db.objectStoreNames.contains('offline'))
        db.createObjectStore('offline', { keyPath: 'src' });
      if (!db.objectStoreNames.contains('localTracks')) {
        const ls = db.createObjectStore('localTracks', { keyPath: 'id', autoIncrement: true });
        ls.createIndex('name', 'name');
      }
      // v3: separate store for binary audio — metadata store stays lean
      if (!db.objectStoreNames.contains('localTrackData'))
        db.createObjectStore('localTrackData'); // keyed by localTrack id
    };
    req.onsuccess = e => { idb = e.target.result; resolve(idb); };
    req.onerror   = e => reject(e.target.error);
  });
}

async function idbGet(store, key) {
  const db = await openIDB();
  const tx = db.transaction(store, 'readonly');
  return new Promise((res, rej) => {
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  });
}

async function idbSet(store, key, value) {
  const db = await openIDB();
  const tx = db.transaction(store, 'readwrite');
  return new Promise((res, rej) => {
    const req = tx.objectStore(store).put(value, key);
    req.onsuccess = () => res();
    req.onerror   = () => rej(req.error);
  });
}

async function idbGetAll(store) {
  const db = await openIDB();
  const tx = db.transaction(store, 'readonly');
  return new Promise((res, rej) => {
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror   = () => rej(req.error);
  });
}

async function idbDelete(store, key) {
  const db = await openIDB();
  const tx = db.transaction(store, 'readwrite');
  return new Promise((res, rej) => {
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => res();
    req.onerror   = () => rej(req.error);
  });
}

// ══════════════════════════════════════════════════════════════
//  Filter state (for tabs)
// ══════════════════════════════════════════════════════════════
let mFilter = 'all';

function filterM(f, btn) {
  document.querySelectorAll('.mtab').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  mFilter = f;
  MusicEngine._page = 0;  // reset pagination on tab switch
  MusicEngine.renderTrackList();
}

// ══════════════════════════════════════════════════════════════
//  Utility helpers
// ══════════════════════════════════════════════════════════════
function formatTime(secs) {
  if (!secs || isNaN(secs)) return '0:00';
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

function formatBytes(bytes) {
  if (!bytes) return '';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function getMediaType(url) {
  if (!url) return 'none';
  if (url.startsWith('blob:')) return 'audio';
  if (url.match(/\.(mp3|wav|ogg|aac|m4a|flac)/i)) return 'audio';
  if (url.match(/\.(mp4|webm|mov|avi)/i)) return 'video';
  if (url.includes('youtube.com') || url.includes('youtu.be')) return 'youtube';
  if (url.includes('soundcloud.com')) return 'soundcloud';
  if (url.includes('spotify.com')) return 'spotify';
  return 'link';
}

function getMusicEmbed(url) {
  const type = getMediaType(url);
  if (type === 'youtube') {
    const m = url.match(/(?:v=|youtu\.be\/|shorts\/)([^&?/]+)/);
    return m ? { type: 'yt', embed: 'https://www.youtube.com/embed/' + m[1] + '?autoplay=1', h: 185 } : null;
  }
  if (type === 'soundcloud')
    return { type: 'sc', embed: `https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23D4942A&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false`, h: 120 };
  if (type === 'spotify') {
    const e = url.replace('open.spotify.com', 'open.spotify.com/embed').replace('/track/', '/embed/track/');
    return { type: 'sp', embed: e, h: 80 };
  }
  return null;
}

function shareTrack(e, id) {
  e.stopPropagation();
  const url = window.location.origin + window.location.pathname + '?track=' + id;
  navigator.clipboard.writeText(url)
    .then(() => MusicEngine.showToast('🔗 Link copied!'))
    .catch(() => MusicEngine.showToast('?track=' + id));
}

// ══════════════════════════════════════════════════════════════
//  MusicEngine v2
// ══════════════════════════════════════════════════════════════
const MusicEngine = {
  audio:        new Audio(),
  playlist:     [],
  currentIndex: -1,
  isPlaying:    false,
  shuffle:      false,
  repeat:       'none',   // 'none' | 'one' | 'all'
  shuffleOrder: [],
  offlineSaved: new Set(),
  localTracks:  [],
  _embedProgTimer: null,
  _embedProgPct:   0,

  // ── Init ────────────────────────────────────────────────────
  async init() {
    // Setup UI immediately — don't wait for IDB
    this.setupAudioListeners();
    this.setupMediaSession();
    this.render();
    this.setupSeekbar();
    this.setupUpload();
    // Load all IDB data in parallel
    await Promise.all([
      this.restoreState(),
      this.loadOfflineStatus(),
      this.loadLocalTracks(),
    ]);
    // Re-render now that local tracks are in the playlist
    this.buildShuffleOrder();
    this.render();
    this.applyRestoredState();
    console.log('[MusicEngine] Ready. Tracks:', this.playlist.length);
  },

  // ── State persistence ────────────────────────────────────────
  async saveState() {
    try {
      await idbSet('state', 'playerState', {
        currentIndex: this.currentIndex,
        currentTime:  this.audio.currentTime || 0,
        currentSrc:   this.audio.src || '',
        shuffle:      this.shuffle,
        repeat:       this.repeat,
        volume:       this.audio.volume,
        savedAt:      Date.now(),
      });
    } catch(e) { console.warn('[MusicEngine] State save failed:', e); }
  },

  async restoreState() {
    try {
      const state = await idbGet('state', 'playerState');
      if (!state) return;
      this.shuffle = state.shuffle || false;
      this.repeat  = state.repeat  || 'none';
      if (state.volume != null) this.audio.volume = state.volume;
      this._restoredIndex = state.currentIndex ?? -1;
      this._restoredTime  = state.currentTime  || 0;
      this._restoredSrc   = state.currentSrc   || '';
    } catch(e) { console.warn('[MusicEngine] State restore failed:', e); }
  },

  applyRestoredState() {
    if (this._restoredIndex >= 0 && this._restoredIndex < this.playlist.length) {
      this.currentIndex = this._restoredIndex;
      const track = this.playlist[this.currentIndex];
      if (track && this._restoredSrc && track.src === this._restoredSrc) {
        this.audio.src = track.src;
        this.audio.currentTime = this._restoredTime || 0;
        this.updateNowPlaying();
      }
    }
    this._restoredIndex = undefined;
    this._restoredTime  = undefined;
    this._restoredSrc   = undefined;
  },

  // ── Load playlist from Firebase ──────────────────────────────
  loadPlaylist(tracks) {
    this.playlist = tracks.map((t, i) => ({ ...t, _listIndex: i }));
    this.buildShuffleOrder();
    this.applyRestoredState();
    this.render();
    // Render worm based on full playlist
    this._renderWorm();
  },

  // ── Shuffle ─────────────────────────────────────────────────
  buildShuffleOrder() {
    this.shuffleOrder = [...Array(this.playlist.length).keys()];
    if (this.shuffle) {
      for (let i = this.shuffleOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [this.shuffleOrder[i], this.shuffleOrder[j]] = [this.shuffleOrder[j], this.shuffleOrder[i]];
      }
    }
  },

  // ── Playback ─────────────────────────────────────────────────
  play(index) {
    if (index != null) this.currentIndex = index;
    if (this.currentIndex < 0) this.currentIndex = 0;
    if (!this.playlist.length) return;

    const track = this.playlist[this.currentIndex];
    if (!track) return;

    // Lazy-load local track src from IDB if not yet loaded
    if (track.isLocal && !track.src) {
      this.playLocal(track.localId);
      return;
    }

    // Clear any embed
    this._clearEmbed();

    const type = getMediaType(track.src);

    if (type === 'audio') {
      if (this.audio.src !== track.src) {
        this.audio.src = track.src;
        this.audio.currentTime = 0;
      }
      this.audio.play()
        .then(() => {
          this.isPlaying = true;
          this.updateNowPlaying();
          this.updateMediaSession(track);
          this.saveState();
        })
        .catch(err => {
          console.warn('[MusicEngine] Play error:', err.message);
          this.updateNowPlaying();
        });
    } else if (type === 'video') {
      const ea = document.getElementById('muf-embed-area');
      const vid = document.createElement('video');
      vid.src = track.src;
      vid.autoplay = true;
      vid.controls = true;
      vid.style.cssText = 'max-height:200px;background:#000;width:100%;border-radius:var(--r2);';
      vid.ontimeupdate = () => {
        const p = vid.duration ? (vid.currentTime / vid.duration * 100) : 0;
        const fill = document.getElementById('muf-progress-fill');
        if (fill) fill.style.width = p + '%';
        const timeEl = document.getElementById('muf-time');
        if (timeEl) timeEl.textContent = formatTime(vid.currentTime) + ' / ' + formatTime(vid.duration);
      };
      vid.onended = () => { if (this.repeat === 'one') this.play(); else this.next(); };
      ea.innerHTML = '';
      ea.appendChild(vid);
      ea.style.display = 'block';
      this.isPlaying = true;
      this.updateNowPlaying();
      this.saveState();
    } else {
      // YouTube / SoundCloud / Spotify / link
      const info = getMusicEmbed(track.src);
      const ea = document.getElementById('muf-embed-area');
      if (info) {
        const iframe = document.createElement('iframe');
        iframe.src = info.embed;
        iframe.height = info.h;
        iframe.allow = 'autoplay;encrypted-media';
        ea.innerHTML = '';
        ea.appendChild(iframe);
        ea.style.display = 'block';
        this._startEmbedProgress();
      } else if (track.src) {
        ea.innerHTML = `<div style="text-align:center;padding:20px;background:var(--s1);border-radius:var(--r2);">
          <div style="color:var(--grey);font-size:.8rem;margin-bottom:12px;font-family:'Barlow Condensed',sans-serif;letter-spacing:.06em">This track opens in an external app</div>
          <a href="${escHtml(track.src)}" target="_blank" style="background:linear-gradient(135deg,var(--gd),var(--gl));color:var(--bg);padding:9px 22px;border-radius:var(--r);font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.12em;text-decoration:none;font-size:.88rem">▶ OPEN TRACK ↗</a>
        </div>`;
        ea.style.display = 'block';
        this._startEmbedProgress();
      }
      this.isPlaying = true;
      this.updateNowPlaying();
      this.saveState();
    }

    // Update cover art
    const cover = document.getElementById('mCover');
    const disc  = document.getElementById('muf-disc');
    if (track.img) {
      cover.src = track.img;
      cover.style.display = 'block';
      cover.classList.add('sp');
      disc.style.display = 'none';
    } else {
      cover.style.display = 'none';
      disc.style.display = 'flex';
    }

    this.showToast('🎵 ' + (track.title || 'Playing'));
    this.updateMediaSession(track);
    this._renderWorm();
  },

  pause() {
    this.audio.pause();
    this.isPlaying = false;
    this.updateNowPlaying();
    this.saveState();
  },

  togglePlay() {
    if (this.isPlaying) this.pause();
    else this.play();
  },

  next() {
    if (!this.playlist.length) return;
    if (this.repeat === 'one') { this.audio.currentTime = 0; this.play(); return; }
    if (this.shuffle) {
      const curPos  = this.shuffleOrder.indexOf(this.currentIndex);
      const nextPos = (curPos + 1) % this.shuffleOrder.length;
      this.play(this.shuffleOrder[nextPos]);
    } else {
      const nextIndex = (this.currentIndex + 1) % this.playlist.length;
      if (nextIndex === 0 && this.repeat === 'none') {
        this.pause();
        this.currentIndex = 0;
        this.audio.currentTime = 0;
        this.updateNowPlaying();
        return;
      }
      this.play(nextIndex);
    }
  },

  prev() {
    if (!this.playlist.length) return;
    if (this.audio.currentTime > 3) { this.audio.currentTime = 0; return; }
    if (this.shuffle) {
      const curPos  = this.shuffleOrder.indexOf(this.currentIndex);
      const prevPos = (curPos - 1 + this.shuffleOrder.length) % this.shuffleOrder.length;
      this.play(this.shuffleOrder[prevPos]);
    } else {
      this.play((this.currentIndex - 1 + this.playlist.length) % this.playlist.length);
    }
  },

  toggleShuffle() {
    this.shuffle = !this.shuffle;
    this.buildShuffleOrder();
    this.saveState();
    const btn = document.getElementById('muf-btn-shuffle');
    if (btn) btn.style.color = this.shuffle ? 'var(--g)' : '';
    this.showToast(this.shuffle ? '🔀 Shuffle on' : '🔀 Shuffle off');
  },

  toggleRepeat() {
    const modes = ['none', 'all', 'one'];
    this.repeat = modes[(modes.indexOf(this.repeat) + 1) % modes.length];
    this.saveState();
    const btn = document.getElementById('muf-btn-repeat');
    if (btn) {
      btn.style.color = this.repeat !== 'none' ? 'var(--g)' : '';
      btn.textContent = this.repeat === 'one' ? '🔂' : '🔁';
    }
    const labels = { none: 'Repeat off', all: '🔁 Repeat all', one: '🔂 Repeat one' };
    this.showToast(labels[this.repeat]);
  },

  seek(fraction) {
    if (!isNaN(this.audio.duration)) {
      this.audio.currentTime = fraction * this.audio.duration;
    }
  },

  // ── Audio events ─────────────────────────────────────────────
  setupAudioListeners() {
    const a = this.audio;
    a.addEventListener('ended', () => { this.isPlaying = false; this.next(); });
    a.addEventListener('timeupdate', () => {
      this.updateProgress();
      if (Math.floor(a.currentTime) % 5 === 0) this.saveState();
    });
    a.addEventListener('play',  () => { this.isPlaying = true;  this.updateNowPlaying(); });
    a.addEventListener('pause', () => { this.isPlaying = false; this.updateNowPlaying(); });
    a.addEventListener('error', () => this.showToast('⚠️ Could not play track'));
    a.addEventListener('waiting', () => {
      const disc = document.getElementById('muf-disc');
      if (disc) disc.style.animationPlayState = 'paused';
    });
    a.addEventListener('playing', () => {
      const disc = document.getElementById('muf-disc');
      if (disc) disc.style.animationPlayState = 'running';
    });
  },

  // ── Media Session API ─────────────────────────────────────────
  setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.setActionHandler('play',          () => this.play());
    navigator.mediaSession.setActionHandler('pause',         () => this.pause());
    navigator.mediaSession.setActionHandler('nexttrack',     () => this.next());
    navigator.mediaSession.setActionHandler('previoustrack', () => this.prev());
    navigator.mediaSession.setActionHandler('seekto', details => {
      if (details.fastSeek && 'fastSeek' in this.audio) this.audio.fastSeek(details.seekTime);
      else this.audio.currentTime = details.seekTime;
    });
    navigator.mediaSession.setActionHandler('seekforward',  d => { this.audio.currentTime = Math.min(this.audio.currentTime + (d.seekOffset || 10), this.audio.duration || 0); });
    navigator.mediaSession.setActionHandler('seekbackward', d => { this.audio.currentTime = Math.max(this.audio.currentTime - (d.seekOffset || 10), 0); });
    console.log('[MusicEngine] Lock screen controls enabled');
  },

  updateMediaSession(track) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.playbackState = this.isPlaying ? 'playing' : 'paused';
    navigator.mediaSession.metadata = new MediaMetadata({
      title:  track.title  || 'Unknown Track',
      artist: track.artist || 'MUFASA STRENGTH',
      album:  'MUFASA Workout Playlist',
      artwork: track.img
        ? [{ src: track.img, sizes: '512x512', type: 'image/jpeg' }]
        : [{ src: '/mufasa-header-logo.png', sizes: '192x192', type: 'image/png' }],
    });
    try {
      if (!isNaN(this.audio.duration) && this.audio.duration > 0) {
        navigator.mediaSession.setPositionState({
          duration:     this.audio.duration,
          playbackRate: this.audio.playbackRate,
          position:     this.audio.currentTime,
        });
      }
    } catch(e) {}
  },

  // ── Offline ───────────────────────────────────────────────────
  async loadOfflineStatus() {
    try {
      const saved = await idbGetAll('offline');
      this.offlineSaved = new Set(saved.map(s => s.src));
    } catch(e) {}
  },

  async saveForOffline(track) {
    if (!track || !track.src) return;
    this.showToast('⏳ Saving "' + track.title + '" for offline…');
    if (navigator.serviceWorker?.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'SAVE_TRACK', url: track.src });
      const handler = event => {
        if (event.data?.type === 'TRACK_SAVED' && event.data.url === track.src) {
          navigator.serviceWorker.removeEventListener('message', handler);
          if (event.data.success) {
            this.offlineSaved.add(track.src);
            idbSet('offline', track.src, { src: track.src, title: track.title, savedAt: Date.now() });
            this.showToast('✅ "' + track.title + '" saved offline!');
            this.renderTrackList();
          } else {
            this.showToast('❌ Save failed — try again on WiFi');
          }
        }
      };
      navigator.serviceWorker.addEventListener('message', handler);
      setTimeout(() => navigator.serviceWorker.removeEventListener('message', handler), 30000);
    } else {
      this.showToast('⚠️ Service worker not active');
    }
  },

  async removeOffline(track) {
    if (!track || !track.src) return;
    if (navigator.serviceWorker?.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'DELETE_TRACK', url: track.src });
    }
    this.offlineSaved.delete(track.src);
    await idbDelete('offline', track.src);
    this.showToast('🗑️ Removed offline copy');
    this.renderTrackList();
  },

  // ── Local tracks ──────────────────────────────────────────────
  async loadLocalTracks() {
    // Load only metadata from IDB — binary lives in 'localTrackData' and is fetched
    // per-track on play, so startup never loads hundreds of MBs into memory.
    try {
      const all = await idbGetAll('localTracks');
      this.localTracks = all;
    } catch(e) { this.localTracks = []; }
    // Populate playlist — src is null until play is triggered (loaded lazily from IDB)
    for (const t of this.localTracks) {
      this.playlist.push({
        id: 'local_' + t.id,
        title: t.name, artist: 'My Music',
        src: null, dur: '', img: null,
        cat: 'local', isLocal: true, localId: t.id,
      });
    }
    if (this.localTracks.length) {
      const badge = document.getElementById('localBadge');
      if (badge) { badge.style.display = 'block'; badge.textContent = this.localTracks.length + ' saved'; }
    }
  },

  // In-memory blob URL cache: id → blobUrl (rebuilt from IDB on demand)
  _fileCache: new Map(),

  _getBlobType(meta) {
    let t = (meta && meta.type) || '';
    if (!t || t === 'video/mp4') {
      const ext = ((meta && (meta.fileName || meta.name)) || '').split('.').pop().toLowerCase();
      const map = { mp3:'audio/mpeg', wav:'audio/wav', aac:'audio/aac', m4a:'audio/mp4',
                    flac:'audio/flac', ogg:'audio/ogg', opus:'audio/opus' };
      t = map[ext] || 'audio/mpeg';
    }
    return t;
  },

  async addLocalFile(file) {
    const AUDIO_EXTS = /\.(mp3|wav|ogg|aac|m4a|flac|opus|weba|wma|aiff|au)$/i;
    const isAudioMime = file.type.startsWith('audio/');
    const isAudioExt  = AUDIO_EXTS.test(file.name);
    const isM4aAsMp4  = file.type === 'video/mp4' && /\.m4a$/i.test(file.name);
    const noType      = !file.type || file.type === '';
    if (!file || (!isAudioMime && !isAudioExt && !isM4aAsMp4 && !noType)) {
      this.showToast('⚠️ Only audio files are supported'); return;
    }

    const arrayBuffer = await file.arrayBuffer();
    const db = await openIDB();

    // Step 1: metadata only in localTracks — no binary here
    const record = {
      name: file.name.replace(/\.[^.]+$/, ''),
      fileName: file.name, type: file.type,
      size: file.size, addedAt: Date.now(), isLocal: true,
    };
    await new Promise((res, rej) => {
      const req = db.transaction('localTracks','readwrite').objectStore('localTracks').add(record);
      req.onsuccess = () => { record.id = req.result; res(); };
      req.onerror   = () => rej(req.error);
    });

    // Step 2: binary in separate localTrackData store — only loaded on play
    await new Promise((res, rej) => {
      const req = db.transaction('localTrackData','readwrite')
                    .objectStore('localTrackData').put(arrayBuffer, record.id);
      req.onsuccess = res; req.onerror = () => rej(req.error);
    });

    // Step 3: blob URL cached in memory for instant play this session
    const blobUrl = URL.createObjectURL(new Blob([arrayBuffer], { type: this._getBlobType(record) }));
    this._fileCache.set(record.id, blobUrl);

    this.localTracks.push({ ...record });
    this.playlist.push({
      id: 'local_' + record.id, title: record.name, artist: 'My Music',
      src: blobUrl, dur: '', img: null, cat: 'local', isLocal: true, localId: record.id,
    });
    this.buildShuffleOrder();
    this.showToast('✅ "' + record.name + '" saved to your library');
    this.renderTrackList();
    this.renderLocalTracks();
    const badge = document.getElementById('localBadge');
    if (badge) { badge.style.display = 'block'; badge.textContent = this.localTracks.length + ' saved'; }
  },

  async playLocal(localTrackId) {
    // Fast path: already have blob URL in memory
    let blobUrl = this._fileCache.get(localTrackId);

    if (!blobUrl) {
      // Cold start (page reload) — fetch binary from IDB for THIS track only
      try {
        const db = await openIDB();
        const data = await new Promise((res, rej) => {
          const req = db.transaction('localTrackData','readonly')
                        .objectStore('localTrackData').get(localTrackId);
          req.onsuccess = () => res(req.result);
          req.onerror   = () => rej(req.error);
        });
        if (!data) { this.showToast('⚠️ Track data missing — please re-add the file'); return; }
        const meta = this.localTracks.find(t => t.id === localTrackId);
        blobUrl = URL.createObjectURL(new Blob([data], { type: this._getBlobType(meta) }));
        this._fileCache.set(localTrackId, blobUrl);
      } catch(e) { this.showToast('⚠️ Could not load track'); return; }
    }

    const existing = this.playlist.find(t => t.localId === localTrackId);
    if (existing) existing.src = blobUrl;
    const idx = this.playlist.findIndex(t => t.localId === localTrackId);
    if (idx >= 0) this.play(idx);
  },

  async deleteLocalTrack(localTrackId) {
    const db = await openIDB();
    await Promise.all([
      idbDelete('localTracks', localTrackId),
      new Promise((res, rej) => {
        const req = db.transaction('localTrackData','readwrite')
                      .objectStore('localTrackData').delete(localTrackId);
        req.onsuccess = res; req.onerror = () => rej(req.error);
      }),
    ]);
    const cached = this._fileCache.get(localTrackId);
    if (cached) { URL.revokeObjectURL(cached); this._fileCache.delete(localTrackId); }
    this.localTracks = this.localTracks.filter(t => t.id !== localTrackId);
    this.playlist    = this.playlist.filter(t => t.localId !== localTrackId);
    this.buildShuffleOrder();
    if (this.currentIndex >= this.playlist.length) this.currentIndex = 0;
    this.renderLocalTracks(); this.renderTrackList();
    this.showToast('🗑️ Track removed');
    const badge = document.getElementById('localBadge');
    if (badge) {
      if (this.localTracks.length) badge.textContent = this.localTracks.length + ' saved';
      else badge.style.display = 'none';
    }
  },

  // ── UI helpers ────────────────────────────────────────────────
  updateNowPlaying() {
    const track = this.playlist[this.currentIndex];
    const titleEl  = document.getElementById('muf-track-title');
    const artistEl = document.getElementById('muf-track-artist');
    const playBtn  = document.getElementById('muf-btn-play');
    const discEl   = document.getElementById('muf-disc');
    const coverEl  = document.getElementById('mCover');

    if (track) {
      if (titleEl)  titleEl.textContent  = track.title  || 'Unknown';
      if (artistEl) artistEl.textContent = (track.artist || '') + (track.cat && !track.isLocal ? ' · ' + track.cat.toUpperCase() : '');
    }

    if (playBtn) playBtn.textContent = this.isPlaying ? '⏸' : '▶';

    if (discEl) {
      if (this.isPlaying) discEl.classList.add('sp');
      else discEl.classList.remove('sp');
    }
    if (coverEl) {
      if (this.isPlaying) coverEl.classList.add('sp');
      else coverEl.classList.remove('sp');
    }

    // Highlight active list item
    document.querySelectorAll('.mitem[data-gi]').forEach(el => {
      el.classList.toggle('act', parseInt(el.dataset.gi) === this.currentIndex);
    });

    this._renderWorm();
    if (this.isPlaying && track) this.updateMediaSession(track);
  },

  updateProgress() {
    const a = this.audio;
    if (!a.duration || isNaN(a.duration)) return;
    const pct = (a.currentTime / a.duration) * 100;
    const bar = document.getElementById('muf-progress-fill');
    if (bar) bar.style.width = pct + '%';
    const segs = document.querySelectorAll('.wseg');
    if (segs.length) {
      const active = Math.floor((pct / 100) * segs.length);
      segs.forEach((seg, i) => {
        seg.classList.toggle('done', i < active);
        seg.classList.toggle('act',  i === active);
      });
    }
    const timeEl = document.getElementById('muf-time');
    if (timeEl) timeEl.textContent = formatTime(a.currentTime) + ' / ' + formatTime(a.duration);
    try {
      if (Math.floor(a.currentTime) % 5 === 0 && 'mediaSession' in navigator) {
        navigator.mediaSession.setPositionState({ duration: a.duration, playbackRate: a.playbackRate, position: a.currentTime });
      }
    } catch(e) {}
  },

  render() {
    this.renderTrackList();
    this.renderLocalTracks();
    this.updateNowPlaying();
    const shuffleBtn = document.getElementById('muf-btn-shuffle');
    const repeatBtn  = document.getElementById('muf-btn-repeat');
    if (shuffleBtn) shuffleBtn.style.color = this.shuffle ? 'var(--g)' : '';
    if (repeatBtn) {
      repeatBtn.style.color = this.repeat !== 'none' ? 'var(--g)' : '';
      repeatBtn.textContent = this.repeat === 'one' ? '🔂' : '🔁';
    }
  },

  PAGE_SIZE: 50,
  _page: 0,

  renderTrackList() {
    const container = document.getElementById('muf-track-list');
    if (!container) return;

    // Apply filter
    let tracks = this.playlist;
    if (mFilter === 'local') tracks = this.playlist.filter(t => t.isLocal);
    else if (mFilter !== 'all') tracks = this.playlist.filter(t => t.cat === mFilter && !t.isLocal);

    if (!tracks.length) {
      container.innerHTML = mFilter === 'local'
        ? '<div class="empty"><strong>No local files loaded</strong>Tap "Load Local Files" above to add MP3s from this device.</div>'
        : '<div class="empty"><strong>No tracks yet</strong>Add music via the Admin Panel → Music</div>';
      return;
    }

    // Paginated slice — only render 50 at a time
    const end   = (this._page + 1) * this.PAGE_SIZE;
    const slice = tracks.slice(0, end);
    const more  = tracks.length > end;

    container.innerHTML = slice.map((track, i) => {
      const gi = this.playlist.indexOf(track);
      const isNow = gi === this.currentIndex;
      return `<div class="mitem${isNow ? ' act' : ''}" onclick="MusicEngine.play(${gi})" data-gi="${gi}">
        <div class="mnum">${isNow && this.isPlaying ? '▶' : i + 1}</div>
        ${track.img ? `<img class="mitem-thumb" src="${escHtml(track.img)}" onerror="this.style.display='none'" alt="">` : ''}
        <div class="mitem-i">
          <div class="mitem-t">${escHtml(track.title || 'Unknown')}</div>
          <div class="mitem-a">${escHtml(track.artist || '')}${track.cat && !track.isLocal ? ' · ' + track.cat.toUpperCase() : ''}${track.isLocal ? ' · 📁 Local' : ''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          ${!track.isLocal ? `
            <button data-offline-btn="${escHtml(track.src)}"
              onclick="event.stopPropagation(); MusicEngine.offlineSaved.has('${escHtml(track.src)}')
                ? MusicEngine.removeOffline(MusicEngine.playlist[${gi}])
                : MusicEngine.saveForOffline(MusicEngine.playlist[${gi}])"
              style="background:none;border:none;cursor:pointer;font-size:.7rem;color:var(--dim);
                     padding:3px 5px;font-family:'Barlow Condensed',sans-serif;font-weight:700;
                     letter-spacing:.04em;transition:color .2s"
              title="${this.offlineSaved.has(track.src) ? 'Remove offline copy' : 'Save for offline'}">
              ${this.offlineSaved.has(track.src) ? '📶 Saved' : '💾 Save'}
            </button>
            <button class="mshr" onclick="shareTrack(event,'${escHtml(track.id)}')">🔗</button>
          ` : `<button onclick="event.stopPropagation();MusicEngine.deleteLocalTrack(${track.localId})" style="background:none;border:none;color:var(--dim);cursor:pointer;font-size:.82rem;padding:4px 6px">🗑️</button>`}
          <span class="mitem-d">${track.dur || ''}</span>
        </div>
      </div>`;
    }).join('');

    if (more) {
      container.insertAdjacentHTML('beforeend',
        `<div style="text-align:center;padding:16px;">
           <button onclick="MusicEngine._page++;MusicEngine.renderTrackList()"
             style="background:var(--gdim);border:1px solid var(--b2);color:var(--g);
                    padding:8px 22px;border-radius:20px;cursor:pointer;
                    font-family:'Barlow Condensed',sans-serif;font-size:.78rem;
                    font-weight:700;letter-spacing:.1em;">
             LOAD MORE (${tracks.length - end} remaining)
           </button>
         </div>`
      );
    }
  },

  renderLocalTracks() {
    // Local tracks appear in the main list (filtered by 'local' tab)
    // This container can show a compact upload prompt if empty
    const container = document.getElementById('muf-local-tracks');
    if (!container) return;
    container.innerHTML = ''; // local tracks shown in main list via filter
  },

  handleSeekClick(e) {
    const bar  = e.currentTarget;
    const rect = bar.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    this.seek(frac);
  },

  setupSeekbar() {
    const seekbar = document.getElementById('muf-progress');
    if (seekbar) seekbar.addEventListener('click', e => this.handleSeekClick(e));
  },

  setupUpload() {
    const input = document.getElementById('muf-local-upload');
    if (input) {
      input.addEventListener('change', async e => {
        const files = Array.from(e.target.files || []);
        for (const file of files) await this.addLocalFile(file);
        input.value = '';
      });
    }
  },

  // ── Embed progress (for YouTube/SC/Spotify) ──────────────────
  _clearEmbed() {
    clearTimeout(this._embedProgTimer);
    this._embedProgPct = 0;
    const ea = document.getElementById('muf-embed-area');
    if (ea) { ea.innerHTML = ''; ea.style.display = 'none'; }
    this.audio.pause();
    this.audio.src = '';
  },

  _startEmbedProgress() {
    clearTimeout(this._embedProgTimer);
    this._embedProgPct = 0;
    const tick = () => {
      if (!this.isPlaying) return;
      this._embedProgPct = Math.min(100, this._embedProgPct + 0.8);
      const fill = document.getElementById('muf-progress-fill');
      if (fill) fill.style.width = this._embedProgPct + '%';
      if (this._embedProgPct >= 100) { if (this.repeat === 'one') this.play(); else this.next(); }
      else this._embedProgTimer = setTimeout(tick, 300);
    };
    tick();
  },

  _renderWorm() {
    const worm = document.getElementById('worm');
    if (!worm || !this.playlist.length) return;
    // Only rebuild DOM if playlist size changed — never on every timeupdate tick
    if (worm.children.length !== this.playlist.length) {
      worm.innerHTML = this.playlist.map((t, i) =>
        `<div class="wseg" title="${escHtml(t.title)}"></div>`
      ).join('');
    }
    // Just toggle classes — no DOM creation
    Array.from(worm.children).forEach((seg, i) => {
      seg.className = 'wseg' +
        (i < this.currentIndex ? ' done' : i === this.currentIndex ? ' act' : '');
    });
  },

  // ── Toast ────────────────────────────────────────────────────
  showToast(msg, duration = 2600) {
    const toast = document.getElementById('toast');
    if (!toast) { console.log('[MusicEngine]', msg); return; }
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), duration);
  },
};
